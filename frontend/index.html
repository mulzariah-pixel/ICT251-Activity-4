
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Product Showcase</title>
    <style>
        :root {
            --blue: #1d4ed8;
            --dark: #172554;
            --light: #eff6ff;
            --border: #dbe3ef;
            --text: #1e293b;
            --muted: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: var(--text);
        }

        header {
            background: linear-gradient(120deg, #172554, #1d4ed8);
            color: white;
            padding: 28px 6%;
        }

        header h1 { margin: 0 0 8px; font-size: 28px; }
        header p { margin: 0; color: #dbeafe; }

        main {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 20px;
        }

        .status {
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 9px;
            background: #e0f2fe;
            color: #075985;
        }

        .panel {
            background: white;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, .04);
        }

        h2 { margin-top: 0; font-size: 20px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .field { display: flex; flex-direction: column; gap: 7px; }
        .field.full { grid-column: 1 / -1; }

        label { font-size: 13px; font-weight: 600; }

        input, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            background: white;
        }

        input:focus, textarea:focus {
            outline: 2px solid #bfdbfe;
            border-color: var(--blue);
        }

        textarea { min-height: 76px; resize: vertical; }

        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        button:disabled { opacity: .6; cursor: wait; }
        .primary { background: var(--blue); color: white; }
        .secondary { background: #e2e8f0; color: #334155; }
        .edit { background: #dbeafe; color: #1d4ed8; }
        .delete { background: #fee2e2; color: #b91c1c; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .toolbar h2 { margin: 0; }
        .toolbar input { max-width: 300px; }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 13px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        th {
            background: var(--light);
            color: var(--dark);
            white-space: nowrap;
        }

        td { overflow-wrap: anywhere; }
        .empty { padding: 25px; text-align: center; color: var(--muted); }

        footer {
            padding: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 760px) {
            .form-grid { grid-template-columns: 1fr; }
            .field.full { grid-column: auto; }
            header h1 { font-size: 23px; }
            .panel { padding: 17px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tech Product Showcase</h1>
        <p>Product inventory management · ICT251 Activity 4 · Question 5</p>
    </header>

    <main>
        <div id="status" class="status" role="status" aria-live="polite">
            Connecting to the product API...
        </div>

        <section class="panel">
            <h2 id="form-title">Add a New Product</h2>

            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="form-grid">
                    <div class="field">
                        <label for="product-name">Product Name *</label>
                        <input id="product-name" maxlength="150" required>
                    </div>

                    <div class="field">
                        <label for="category">Category *</label>
                        <input id="category" required>
                    </div>

                    <div class="field">
                        <label for="brand">Brand *</label>
                        <input id="brand" required>
                    </div>

                    <div class="field">
                        <label for="price">Price *</label>
                        <input id="price" type="number" min="0" step="0.01" required>
                    </div>

                    <div class="field">
                        <label for="stock">Stock Quantity *</label>
                        <input id="stock" type="number" min="0" step="1" required>
                    </div>

                    <div class="field full">
                        <label for="description">Description</label>
                        <textarea id="description"></textarea>
                    </div>
                </div>

                <div class="actions">
                    <button class="primary" id="save-button" type="submit">
                        Add Product
                    </button>
                    <button class="secondary" id="cancel-button" type="button" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="toolbar">
                <h2>Product Inventory</h2>
                <input id="search" type="search" placeholder="Search products..."
                       aria-label="Search products">
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Brand</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <tr><td colspan="7" class="empty">Loading products...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>ICT251 Activity 4 · Tech Product Showcase</footer>
    <script src="app.js"></script>
</body>
</html>
